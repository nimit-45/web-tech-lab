<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - GCET Jammu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <div class="header-left">
            <img src="images/logo.jpg" alt="GCET Logo">
            <div class="header-titles">
                <h1>Govt. College of Engineering and Technology, Jammu</h1>
                <p>(Autonomous College)</p>
            </div>
        </div>
        <a href="studentlogin.html" class="login-btn">Student Login</a>
    </div>

    <div class="nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="faculty.html">Faculty</a>
        <a href="students.html">Students</a>
        <a href="gallery.html">Gallery</a>
        <a href="admission.html">Admission</a>
        <a href="contact.html">Contact</a>
    </div>

    <div class="container">
        <div style="max-width: 350px; margin: 40px auto; background: white; padding: 30px; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center;">
            <h2 style="color: #1a4d8c; margin-top: 0;">Student Login</h2>
            <form action="dashboard.html">
                <input type="text" name="rollno" placeholder="Roll Number" required style="width: 90%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;">
                <input type="password" name="password" placeholder="Password" required style="width: 90%; padding: 10px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px;">
                <button type="submit" class="login-btn" style="width: 100%; border: none; cursor: pointer; padding: 12px;">Login to Portal</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2026 GCET Jammu. All Rights Reserved.</p>
        <p><b>Submitted by: Nimit Sharma</b></p>
    </div>

</body>
</html>
